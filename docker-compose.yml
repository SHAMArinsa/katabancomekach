# Optional: run the whole stack with Docker (not required for local Windows development).
#   docker compose up --build
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python -m scripts.seed
#   docker compose exec backend python -m scripts.create_admin --email you@example.com
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glass_store
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/glass_store
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      PUBLIC_API_URL: http://localhost:8080
      SECRET_KEY: docker-dev-only-secret-change-me-0123456789
    depends_on: [db]
    volumes: [uploads:/app/uploads, private:/app/private_uploads]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes: { pgdata: {}, uploads: {}, private: {} }
